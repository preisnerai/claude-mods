name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Unpinned on purpose: the mod API is early access, so CI follows the current release.
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate model-router
      - run: claude plugin test model-router
      - run: claude plugin validate find-mod
      - run: claude plugin test find-mod
